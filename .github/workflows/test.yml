name: test
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [18, 20, 22, 24] } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ matrix.node }}' }
      - run: node --test test/check.test.js
      - name: CLI smoke test on the fixture
        run: N8N_ENCRYPTION_KEY=fixture-key-NOT-a-secret-0123456789 node bin/n8n-key-check.js test/fixtures/n8n-2.40.6-export.json
